# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://help.github.com/actions/language-and-framework-guides/publishing-nodejs-packages

name: Node.js Package

on:
  release:
    types: [created]

permissions:
  id-token: write  # Required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      # 必须与本地写 lock 的 npm 版本一致：11.6.1 起不再把可选传递依赖
      # (@napi-rs/wasm-runtime) 的 auto-install peer (@emnapi/*) 写入 lock，
      # 而旧版 npm 要求它们存在，会以 EUSAGE 拒绝该 lock。
      # 注意：npm/cli#8699 (provenance 422) 目前仍 open，若发布再次触发该 bug，
      # 可回退到 11.5.1，但届时 lock 需用 `npx npm@10.8.2 install --package-lock-only` 生成。
      - run: npm install -g npm@11.6.1
      - run: npm ci
      - run: npm run build --if-present
      - run: npm publish --provenance