# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://help.github.com/actions/language-and-framework-guides/publishing-nodejs-packages

name: Node.js Package

on:
  release:
    types: [created]

permissions:
  id-token: write  # Required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      # Must match the npm that writes the lock file locally. From 11.6.1 npm no
      # longer records the auto-install peers (@emnapi/*) of an optional transitive
      # dependency (@napi-rs/wasm-runtime); older npm demands them and rejects the
      # lock file with EUSAGE.
      # Note: npm/cli#8699 (provenance 422) is still open. If publishing hits that
      # bug again, roll back to 11.5.1 -- but then the lock must be generated with
      # `npx npm@10.8.2 install --package-lock-only`.
      - run: npm install -g npm@11.6.1
      - run: npm ci
      - run: npm run build --if-present
      - run: npm publish --provenance